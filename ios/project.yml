name: LepLog
options:
  bundleIdPrefix: com.jaredvick
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
targets:
  LepLog:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LepLog/Sources
    resources:
      - path: LepLog/Resources/Assets.xcassets
    info:
      path: LepLog/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredvick.leplog
        PRODUCT_NAME: "Lep Log"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
